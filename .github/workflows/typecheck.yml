name: TypeScript Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck
      - name: Check theology SSOT consistency (Issue #15, Risk #6)
        # Deterministisches Node-Gate: sichert, dass die 3 theologischen Fragen
        # konsistent bleiben und constants.ts (Web) weiterhin aus derselben JSON
        # liest wie Godot (TheologyData) — keine Doppelpflege.
        run: npm run check:theology
